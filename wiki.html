<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Studio Iyan wiki for VPM tools, utility tools, and reference pages." />
  <meta name="theme-color" content="#0e1117" />
  <meta property="og:title" content="Studio Iyan Wiki" />
  <meta property="og:description" content="Reference pages for VPM tools, utility tools, and usage notes." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://studio.iyan-kim.dev/wiki.html" />
  <meta property="og:image" content="https://studio.iyan-kim.dev/assets/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Studio Iyan Wiki" />
  <meta name="twitter:description" content="Reference pages for VPM tools, utility tools, and usage notes." />
  <meta name="twitter:image" content="https://studio.iyan-kim.dev/assets/og-image.png" />
  <link rel="canonical" href="https://studio.iyan-kim.dev/wiki.html" />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <title>Wiki | Studio Iyan</title>
  <link rel="stylesheet" href="./src/css/site.css" />
</head>

<body class="wiki-body">
  <div class="language-switcher" aria-label="Language selector">
    <button class="language-switcher__button" type="button" data-language="ko">KO</button>
    <button class="language-switcher__button language-switcher__button--active" type="button" data-language="en">EN</button>
    <button class="language-switcher__button" type="button" data-language="ja">JA</button>
  </div>

  <main class="wiki-shell">
    <aside class="wiki-sidebar" aria-label="Wiki sidebar">
      <div class="wiki-sidebar__brand">
        <p class="wiki-sidebar__eyebrow" data-i18n="brand.eyebrow">Studio Iyan</p>
        <h1 class="wiki-sidebar__title" data-i18n="brand.title">Wiki</h1>
        <p class="wiki-sidebar__copy" data-i18n="brand.copy">
          A compact reference area for VPM tools, utility tools, and project notes.
        </p>
        <a class="wiki-home-link" href="./index.html" data-i18n="brand.homeLink">Back to Home</a>
      </div>

      <nav class="wiki-nav" aria-label="Wiki table of contents">
        <p class="wiki-nav__label" data-i18n="nav.label">Contents</p>
        <button class="wiki-nav__button wiki-nav__button--active" type="button" data-wiki-tab="overview"
          aria-current="page" data-i18n="nav.overview">
          Overview
        </button>

        <div class="wiki-nav__group" data-wiki-group="vpm-tools">
          <button class="wiki-nav__button wiki-nav__button--group" type="button" data-wiki-group-toggle="vpm-tools"
            data-i18n="nav.vpmTools" aria-expanded="false">
            VPM Tools
          </button>
          <div class="wiki-nav__subgroup" data-wiki-group-panel="vpm-tools" hidden>
            <button class="wiki-nav__subbutton" type="button" data-wiki-tab="vpm-tools-overview"
              data-i18n="nav.overview">
              Overview
            </button>
            <button class="wiki-nav__subbutton" type="button" data-wiki-tab="plane-fit-to-camera-tool"
              data-i18n="nav.planeFitToCameraTool">
              Plane Fit To Camera Tool
            </button>
            <button class="wiki-nav__subbutton" type="button" data-wiki-tab="ma-blendshape-sync-auto-setup"
              data-i18n="nav.maBlendshapeSyncAutoSetup">
              MA Blendshape Sync Auto Setup
            </button>
            <button class="wiki-nav__subbutton" type="button" data-wiki-tab="hierarchy-plus-rebone"
              data-i18n="nav.hierarchyPlusRebone">
              Hierarchy Plus Rebone
            </button>
            <button class="wiki-nav__subbutton" type="button" data-wiki-tab="prefab-material-remapper"
              data-i18n="nav.prefabMaterialRemapper">
              Prefab Material Remapper
            </button>
            <button class="wiki-nav__subbutton" type="button" data-wiki-tab="uv-mask-tool"
              data-i18n="nav.uvMaskTool">
              UV Mask Tool
            </button>
          </div>
        </div>

        <div class="wiki-nav__group" data-wiki-group="tools">
          <button class="wiki-nav__button wiki-nav__button--group" type="button" data-wiki-group-toggle="tools"
            data-i18n="nav.tools" aria-expanded="false">
            Tools
          </button>
          <div class="wiki-nav__subgroup" data-wiki-group-panel="tools" hidden>
            <button class="wiki-nav__subbutton" type="button" data-wiki-tab="tools-overview"
              data-i18n="nav.overview">
              Overview
            </button>
            <button class="wiki-nav__subbutton" type="button" data-wiki-tab="vsf-avatar-converter"
              data-i18n="nav.vsfAvatarConverter">
              VSF Avatar Converter
            </button>
            <button class="wiki-nav__subbutton" type="button" data-wiki-tab="sdf-generator"
              data-i18n="nav.sdfGenerator">
              SDF Generator
            </button>
          </div>
        </div>

        <button class="wiki-nav__button" type="button" data-wiki-tab="notes" data-i18n="nav.notes">
          Notes
        </button>
      </nav>
    </aside>

    <section class="wiki-main" aria-live="polite">
      <article class="wiki-article">
        <section class="wiki-panel is-active" id="overview" data-wiki-panel aria-label="Overview">
          <div class="wiki-markdown" data-wiki-content="overview"></div>
        </section>

        <section class="wiki-panel" id="vpm-tools-overview" data-wiki-panel hidden aria-label="VPM Tools Overview">
          <div class="wiki-markdown" data-wiki-content="vpmToolsOverview"></div>
        </section>

        <section class="wiki-panel" id="plane-fit-to-camera-tool" data-wiki-panel hidden aria-label="Plane Fit To Camera Tool">
          <div class="wiki-markdown" data-wiki-content="planeFitToCameraTool"></div>
        </section>

        <section class="wiki-panel" id="ma-blendshape-sync-auto-setup" data-wiki-panel hidden aria-label="MA Blendshape Sync Auto Setup">
          <div class="wiki-markdown" data-wiki-content="maBlendshapeSyncAutoSetup"></div>
        </section>

        <section class="wiki-panel" id="hierarchy-plus-rebone" data-wiki-panel hidden aria-label="Hierarchy Plus Rebone">
          <div class="wiki-markdown" data-wiki-content="hierarchyPlusRebone"></div>
        </section>

        <section class="wiki-panel" id="prefab-material-remapper" data-wiki-panel hidden aria-label="Prefab Material Remapper">
          <div class="wiki-markdown" data-wiki-content="prefabMaterialRemapper"></div>
        </section>

        <section class="wiki-panel" id="uv-mask-tool" data-wiki-panel hidden aria-label="UV Mask Tool">
          <div class="wiki-markdown" data-wiki-content="uvMaskTool"></div>
        </section>

        <section class="wiki-panel" id="tools-overview" data-wiki-panel hidden aria-label="Tools Overview">
          <div class="wiki-markdown" data-wiki-content="toolsOverview"></div>
        </section>

        <section class="wiki-panel" id="vsf-avatar-converter" data-wiki-panel hidden aria-label="VSF Avatar Converter">
          <div class="wiki-markdown" data-wiki-content="vsfAvatarConverter"></div>
        </section>

        <section class="wiki-panel" id="sdf-generator" data-wiki-panel hidden aria-label="SDF Generator">
          <div class="wiki-markdown" data-wiki-content="sdfGenerator"></div>
        </section>

        <section class="wiki-panel" id="notes" data-wiki-panel hidden aria-label="Notes">
          <div class="wiki-markdown" data-wiki-content="notes"></div>
        </section>
      </article>
    </section>
  </main>

  <script type="module" src="./src/js/wiki.js"></script>
</body>

</html>
